name: Bug
description: Report a technical bug (broken page, search problem, map issue)
title: "[Bug] <short description>"
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Page URL where the bug appears.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
