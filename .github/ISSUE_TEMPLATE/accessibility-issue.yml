name: Accessibility issue
description: Report an accessibility problem (WCAG)
title: "[Accessibility] <short description>"
labels: ["a11y"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem and how you encountered it (keyboard, screen reader, low vision, color, motion, etc.).
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Page URL where the issue appears.
  - type: dropdown
    id: wcag
    attributes:
      label: WCAG criterion (if known)
      options:
        - 1.1.1 Non-text Content
        - 1.3.1 Info and Relationships
        - 1.4.3 Contrast (Minimum)
        - 2.1.1 Keyboard
        - 2.4.2 Page Titled
        - 3.2.2 On Input
        - 4.1.2 Name, Role, Value
        - Not sure
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what actually happened.
