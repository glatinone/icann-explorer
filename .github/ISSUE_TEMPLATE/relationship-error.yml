name: Relationship error
description: Report a wrong or missing relationship between two groups
title: "[Relationship error] <from> - <to>"
labels: ["content"]
body:
  - type: input
    id: from
    attributes:
      label: From (group A)
      description: Acronym of the source group of the relationship.
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: To (group B)
      description: Acronym of the target group of the relationship.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem kind
      options:
        - Relationship is wrong
        - Relationship is missing
        - Relationship is the wrong type
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What's wrong
      description: What the relationship is or should be, and why.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Official ICANN source or trusted reference.
    validations:
      required: true
