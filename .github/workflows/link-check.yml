name: Weekly link check

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run link check
        id: links
        run: |
          set +e
          OUT=$(pnpm check:links 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "## :link: Weekly link check"
            echo
            echo '```'
            echo "$OUT"
            echo '```'
            echo
            if [ $CODE -ne 0 ]; then
              echo ":x: **Broken links found.** Please fix them in the content or source data."
            else
              echo ":white_check_mark: All local links resolve."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
      - name: Open issue if broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "bug",
            });
            const exists = issues.some(
              (i) => i.title === "[Bug] Weekly link check failed",
            );
            if (exists) {
              console.log("Issue already open. Skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[Bug] Weekly link check failed",
              labels: ["bug"],
              body: "The weekly `check:links` job failed. See the workflow run for details. Fix the broken links, then close this issue.",
            });
